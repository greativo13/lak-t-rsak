<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const STORE_KEY = "lakotarsak.v1";

/* ---------- persistence ---------- */
const SEED = {
  shopping: [
    { id: uid(), name: "Tej", qty: "2 l", img: null, done: false },
    { id: uid(), name: "Tojás", qty: "10 db", img: null, done: false },
    { id: uid(), name: "WC-papír", qty: "1 csomag", img: null, done: true },
  ],
  inventory: [
    { id: uid(), name: "Kávé", qty: "fél zacskó", status: "amber", img: null },
    { id: uid(), name: "Mosogatószer", qty: "majdnem tele", status: "green", img: null },
    { id: uid(), name: "Cukor", qty: "elfogyott", status: "red", img: null },
  ],
  debts: [
    { id: uid(), payer: "Anna", amount: 3200, note: "közös nagybevásárlás", settled: false },
    { id: uid(), payer: "Bence", amount: 1500, note: "pizza péntek este", settled: false },
  ],
};

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return SEED;
    const p = JSON.parse(raw);
    return {
      shopping: Array.isArray(p.shopping) ? p.shopping : [],
      inventory: Array.isArray(p.inventory) ? p.inventory : [],
      debts: Array.isArray(p.debts) ? p.debts : [],
    };
  } catch (e) { return SEED; }
}

function useStore() {
  const [state, setState] = useState(loadStore);
  useEffect(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }, [state]);
  return [state, setState];
}

/* ---------- image helper ---------- */
function compressImage(file, maxDim = 900, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
        else if (height >= width && height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
        const c = document.createElement("canvas");
        c.width = width; c.height = height;
        c.getContext("2d").drawImage(img, 0, 0, width, height);
        try { resolve(c.toDataURL("image/jpeg", quality)); } catch (err) { reject(err); }
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const forint = (n) => (Number(n) || 0).toLocaleString("hu-HU") + " Ft";

/* ---------- small pieces ---------- */
function Icon({ name, className }) {
  const p = {
    cart: "M2.5 3h1.6a1 1 0 0 1 .97.76L5.4 6m0 0 1.3 6.5a2 2 0 0 0 1.96 1.6h6.9a2 2 0 0 0 1.95-1.55l1.2-5.2A.9.9 0 0 0 18.72 6H5.4Zm3.1 12.5a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6Zm8.8 0a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6Z",
    box: "M3.5 7.5 12 3l8.5 4.5M3.5 7.5 12 12m-8.5-4.5v9L12 21m0-9 8.5-4.5M12 12v9m8.5-13.5v9L12 21",
    wallet: "M3 7.5A2.5 2.5 0 0 1 5.5 5H18a2 2 0 0 1 2 2v.5M3 7.5V17a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-2M3 7.5h15a2 2 0 0 1 2 2V13m0 0h-3.5a1.75 1.75 0 1 0 0 3.5H20",
    plus: "M12 5v14M5 12h14",
    trash: "M4 7h16M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7m2 0v11.5A1.5 1.5 0 0 1 15.5 20h-7A1.5 1.5 0 0 1 7 18.5V7",
    check: "M4.5 12.5 9.5 17.5 19.5 6.5",
    edit: "M4 20h4L18.5 9.5a2 2 0 0 0 0-2.83l-1.17-1.17a2 2 0 0 0-2.83 0L4 16v4Z",
    camera: "M4 8.5A1.5 1.5 0 0 1 5.5 7h1.7l1-1.6A1 1 0 0 1 10 5h4a1 1 0 0 1 .85.47L15.8 7h2.7A1.5 1.5 0 0 1 20 8.5v9A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5v-9Z M12 10.5a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z",
    x: "M6 6l12 12M18 6 6 18",
    arrow: "M5 12h14M13 6l6 6-6 6",
  }[name];
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
      strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">
      <path d={p} />
    </svg>
  );
}

function ImagePicker({ value, onChange, size = 56 }) {
  const inputRef = useRef(null);
  const [busy, setBusy] = useState(false);
  const pick = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setBusy(true);
    try { onChange(await compressImage(file)); }
    catch (err) { alert("A képet nem sikerült beolvasni."); }
    finally { setBusy(false); if (inputRef.current) inputRef.current.value = ""; }
  };
  return (
    <div className="flex-none">
      <input ref={inputRef} type="file" accept="image/*" className="hidden" onChange={pick} />
      {value ? (
        <button type="button" onClick={() => onChange(null)}
          className="relative block rounded-xl overflow-hidden border"
          style={{ width: size, height: size, borderColor: "var(--line)" }}
          title="Kép eltávolítása">
          <img src={value} alt="" className="w-full h-full object-cover" />
          <span className="absolute top-0.5 right-0.5 rounded-full p-0.5"
            style={{ background: "rgba(0,0,0,.55)", color: "#fff" }}>
            <Icon name="x" className="w-3 h-3" />
          </span>
        </button>
      ) : (
        <button type="button" onClick={() => inputRef.current && inputRef.current.click()}
          className="grid place-items-center rounded-xl border border-dashed"
          style={{ width: size, height: size, borderColor: "var(--line)", background: "var(--surface-2)", color: "var(--muted)" }}
          title="Kép hozzáadása">
          {busy
            ? <span className="text-[10px]">…</span>
            : <Icon name="camera" className="w-6 h-6" />}
        </button>
      )}
    </div>
  );
}

function Thumb({ src, fallback }) {
  if (src) return <img src={src} alt="" className="w-12 h-12 rounded-xl object-cover flex-none" />;
  return (
    <div className="w-12 h-12 rounded-xl grid place-items-center flex-none font-display text-lg"
      style={{ background: "var(--surface-2)", color: "var(--muted)" }}>
      {fallback}
    </div>
  );
}

function SectionHead({ title, hint, action }) {
  return (
    <div className="flex items-end justify-between gap-3 mb-3">
      <div>
        <h2 className="font-display text-[26px] leading-none font-semibold tracking-[-.01em]">{title}</h2>
        {hint && <p className="text-[13px] mt-1.5" style={{ color: "var(--muted)" }}>{hint}</p>}
      </div>
      {action}
    </div>
  );
}

function Empty({ children }) {
  return (
    <div className="card p-8 text-center" style={{ color: "var(--muted)" }}>
      <p className="text-[14px]">{children}</p>
    </div>
  );
}

/* ================= SHOPPING ================= */
function ShoppingView({ items, setItems }) {
  const [open, setOpen] = useState(false);
  const [name, setName] = useState("");
  const [qty, setQty] = useState("");
  const [img, setImg] = useState(null);
  const nameRef = useRef(null);

  const reset = () => { setName(""); setQty(""); setImg(null); };
  const add = (e) => {
    e.preventDefault();
    if (!name.trim()) { nameRef.current && nameRef.current.focus(); return; }
    setItems((a) => [{ id: uid(), name: name.trim(), qty: qty.trim(), img, done: false }, ...a]);
    reset();
    nameRef.current && nameRef.current.focus();
  };
  const toggle = (id) => setItems((a) => a.map((i) => i.id === id ? { ...i, done: !i.done } : i));
  const remove = (id) => setItems((a) => a.filter((i) => i.id !== id));
  const clearAll = () => {
    if (!items.length) return;
    if (confirm("Biztosan törlöd az egész bevásárlólistát?")) setItems([]);
  };

  const active = items.filter((i) => !i.done);
  const done = items.filter((i) => i.done);
  const ordered = [...active, ...done];

  return (
    <div className="pop">
      <SectionHead
        title="Bevásárlólista"
        hint={items.length ? `${active.length} tétel hátra${done.length ? ` · ${done.length} kész` : ""}` : "Mit kell venni?"}
        action={
          <button onClick={() => { setOpen((o) => !o); setTimeout(() => nameRef.current && nameRef.current.focus(), 30); }}
            className="btn-accent inline-flex items-center gap-1.5 pl-3 pr-4 py-2.5 text-[14px]">
            <Icon name="plus" className="w-[18px] h-[18px]" /> Új tétel
          </button>
        }
      />

      {open && (
        <form onSubmit={add} className="card p-3.5 mb-4 pop">
          <div className="flex gap-3">
            <ImagePicker value={img} onChange={setImg} />
            <div className="flex-1 space-y-2.5 min-w-0">
              <input ref={nameRef} className="field" placeholder="Mit? (pl. Kenyér)"
                value={name} onChange={(e) => setName(e.target.value)} />
              <input className="field" placeholder="Mennyit? (pl. 1 db) — opcionális"
                value={qty} onChange={(e) => setQty(e.target.value)} />
            </div>
          </div>
          <div className="flex gap-2 mt-3">
            <button type="submit" className="btn-accent flex-1 py-2.5 text-[14px]">Hozzáadás</button>
            <button type="button" onClick={() => { setOpen(false); reset(); }}
              className="px-4 py-2.5 rounded-xl text-[14px] font-semibold"
              style={{ background: "var(--surface-2)", color: "var(--muted)" }}>Mégse</button>
          </div>
        </form>
      )}

      {items.length === 0 ? (
        <Empty>A lista üres. Koppints az <b>Új tétel</b> gombra.</Empty>
      ) : (
        <ul className="space-y-2">
          {ordered.map((i) => (
            <li key={i.id} className="card p-2.5 flex items-center gap-3">
              <button className="checkbox" data-on={i.done} onClick={() => toggle(i.id)}
                aria-label={i.done ? "Vissza" : "Megvettem"}>
                {i.done && <Icon name="check" className="w-4 h-4" style={{ color: "var(--accent-ink)" }} />}
              </button>
              <Thumb src={i.img} fallback={i.name.slice(0, 1).toUpperCase()} />
              <div className="flex-1 min-w-0">
                <p className={"font-semibold truncate " + (i.done ? "line-through" : "")}
                  style={{ color: i.done ? "var(--muted)" : "var(--ink)" }}>{i.name}</p>
                {i.qty && <p className="text-[13px] truncate" style={{ color: "var(--muted)" }}>{i.qty}</p>}
              </div>
              <button onClick={() => remove(i.id)} className="p-2 rounded-lg flex-none"
                style={{ color: "var(--muted)" }} aria-label="Törlés">
                <Icon name="trash" className="w-[18px] h-[18px]" />
              </button>
            </li>
          ))}
        </ul>
      )}

      {items.length > 0 && (
        <button onClick={clearAll}
          className="mt-5 w-full py-3 rounded-xl text-[14px] font-semibold inline-flex items-center justify-center gap-2 border"
          style={{ color: "var(--red)", borderColor: "var(--red-line)", background: "var(--red-bg)" }}>
          <Icon name="trash" className="w-[18px] h-[18px]" /> Egész lista törlése
        </button>
      )}
    </div>
  );
}

/* ================= INVENTORY ================= */
const STATUS = {
  green: { label: "Van elég", dot: "var(--green)", bg: "var(--green-bg)", line: "var(--green-line)" },
  amber: { label: "Kevés", dot: "var(--amber)", bg: "var(--amber-bg)", line: "var(--amber-line)" },
  red:   { label: "Elfogyott", dot: "var(--red)", bg: "var(--red-bg)", line: "var(--red-line)" },
};

function InvForm({ initial, onSave, onCancel }) {
  const [name, setName] = useState(initial ? initial.name : "");
  const [qty, setQty] = useState(initial ? initial.qty : "");
  const [status, setStatus] = useState(initial ? initial.status : "green");
  const [img, setImg] = useState(initial ? initial.img : null);
  const nameRef = useRef(null);
  useEffect(() => { nameRef.current && nameRef.current.focus(); }, []);

  const submit = (e) => {
    e.preventDefault();
    if (!name.trim()) { nameRef.current && nameRef.current.focus(); return; }
    onSave({ name: name.trim(), qty: qty.trim(), status, img });
  };
  return (
    <form onSubmit={submit} className="card p-3.5 mb-4 pop">
      <div className="flex gap-3">
        <ImagePicker value={img} onChange={setImg} />
        <div className="flex-1 space-y-2.5 min-w-0">
          <input ref={nameRef} className="field" placeholder="Mi? (pl. Liszt)"
            value={name} onChange={(e) => setName(e.target.value)} />
          <input className="field" placeholder="Mennyi / szint (pl. fél kg) — opcionális"
            value={qty} onChange={(e) => setQty(e.target.value)} />
        </div>
      </div>
      <div className="seg mt-3">
        {Object.entries(STATUS).map(([key, s]) => (
          <button type="button" key={key} onClick={() => setStatus(key)}
            style={status === key
              ? { background: s.bg, color: s.dot, boxShadow: `inset 0 0 0 1.5px ${s.line}` }
              : { color: "var(--muted)" }}>
            <span className="inline-block w-2.5 h-2.5 rounded-full mr-1.5 align-middle" style={{ background: s.dot }} />
            {s.label}
          </button>
        ))}
      </div>
      <div className="flex gap-2 mt-3">
        <button type="submit" className="btn-accent flex-1 py-2.5 text-[14px]">{initial ? "Mentés" : "Hozzáadás"}</button>
        <button type="button" onClick={onCancel}
          className="px-4 py-2.5 rounded-xl text-[14px] font-semibold"
          style={{ background: "var(--surface-2)", color: "var(--muted)" }}>Mégse</button>
      </div>
    </form>
  );
}

function InventoryView({ items, setItems }) {
  const [adding, setAdding] = useState(false);
  const [editId, setEditId] = useState(null);

  const add = (data) => { setItems((a) => [{ id: uid(), ...data }, ...a]); setAdding(false); };
  const save = (id, data) => { setItems((a) => a.map((i) => i.id === id ? { ...i, ...data } : i)); setEditId(null); };
  const remove = (id) => setItems((a) => a.filter((i) => i.id !== id));

  const counts = { green: 0, amber: 0, red: 0 };
  items.forEach((i) => { counts[i.status] = (counts[i.status] || 0) + 1; });

  return (
    <div className="pop">
      <SectionHead
        title="Otthoni készlet"
        hint={items.length ? "Mi van itthon, miből kevés" : "Kövesd, miből mennyi van"}
        action={
          <button onClick={() => { setAdding((o) => !o); setEditId(null); }}
            className="btn-accent inline-flex items-center gap-1.5 pl-3 pr-4 py-2.5 text-[14px]">
            <Icon name="plus" className="w-[18px] h-[18px]" /> Új tétel
          </button>
        }
      />

      {items.length > 0 && (
        <div className="flex gap-2 mb-4">
          {Object.entries(STATUS).map(([key, s]) => (
            <div key={key} className="flex-1 card px-3 py-2.5 flex items-center gap-2">
              <span className="w-3 h-3 rounded-full flex-none" style={{ background: s.dot }} />
              <div className="min-w-0">
                <div className="font-display text-xl leading-none tnum">{counts[key]}</div>
                <div className="text-[11px] truncate" style={{ color: "var(--muted)" }}>{s.label}</div>
              </div>
            </div>
          ))}
        </div>
      )}

      {adding && <InvForm onSave={add} onCancel={() => setAdding(false)} />}

      {items.length === 0 && !adding ? (
        <Empty>Még nincs készlet-tétel. Add hozzá az elsőt!</Empty>
      ) : (
        <ul className="space-y-2">
          {items.map((i) => (
            editId === i.id ? (
              <li key={i.id}>
                <InvForm initial={i} onSave={(d) => save(i.id, d)} onCancel={() => setEditId(null)} />
              </li>
            ) : (
              <li key={i.id} className="card p-2.5 flex items-center gap-3 border-l-4"
                style={{ borderLeftColor: STATUS[i.status].dot }}>
                <Thumb src={i.img} fallback={i.name.slice(0, 1).toUpperCase()} />
                <div className="flex-1 min-w-0">
                  <p className="font-semibold truncate">{i.name}</p>
                  <div className="flex items-center gap-2 mt-0.5">
                    <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full"
                      style={{ background: STATUS[i.status].bg, color: STATUS[i.status].dot }}>
                      {STATUS[i.status].label}
                    </span>
                    {i.qty && <span className="text-[13px] truncate" style={{ color: "var(--muted)" }}>{i.qty}</span>}
                  </div>
                </div>
                <button onClick={() => { setEditId(i.id); setAdding(false); }} className="p-2 rounded-lg flex-none"
                  style={{ color: "var(--muted)" }} aria-label="Módosítás">
                  <Icon name="edit" className="w-[18px] h-[18px]" />
                </button>
                <button onClick={() => remove(i.id)} className="p-2 rounded-lg flex-none"
                  style={{ color: "var(--muted)" }} aria-label="Törlés">
                  <Icon name="trash" className="w-[18px] h-[18px]" />
                </button>
              </li>
            )
          ))}
        </ul>
      )}
    </div>
  );
}

/* ================= DEBTS ================= */
function DebtsView({ items, setItems }) {
  const [open, setOpen] = useState(false);
  const [payer, setPayer] = useState("");
  const [amount, setAmount] = useState("");
  const [note, setNote] = useState("");
  const [leaving, setLeaving] = useState({});
  const payerRef = useRef(null);

  const reset = () => { setPayer(""); setAmount(""); setNote(""); };
  const add = (e) => {
    e.preventDefault();
    if (!payer.trim() || !String(amount).trim()) { payerRef.current && payerRef.current.focus(); return; }
    setItems((a) => [{ id: uid(), payer: payer.trim(), amount: Math.round(Number(amount)) || 0, note: note.trim(), settled: false }, ...a]);
    reset();
    payerRef.current && payerRef.current.focus();
  };
  const settle = (id) => {
    setLeaving((l) => ({ ...l, [id]: true }));
    setTimeout(() => {
      setItems((a) => a.filter((i) => i.id !== id));
      setLeaving((l) => { const n = { ...l }; delete n[id]; return n; });
    }, 480);
  };
  const remove = (id) => setItems((a) => a.filter((i) => i.id !== id));

  return (
    <div className="pop">
      <SectionHead
        title="Ki kinek tartozik"
        hint={items.length ? `${items.length} nyitott tartozás` : "Nyitott tartozások"}
        action={
          <button onClick={() => { setOpen((o) => !o); setTimeout(() => payerRef.current && payerRef.current.focus(), 30); }}
            className="btn-accent inline-flex items-center gap-1.5 pl-3 pr-4 py-2.5 text-[14px]">
            <Icon name="plus" className="w-[18px] h-[18px]" /> Új
          </button>
        }
      />

      {open && (
        <form onSubmit={add} className="card p-3.5 mb-4 pop space-y-2.5">
          <input ref={payerRef} className="field" placeholder="Ki fizette? (pl. Anna)"
            value={payer} onChange={(e) => setPayer(e.target.value)} />
          <input className="field tnum" inputMode="numeric" placeholder="Mennyit? (Ft)"
            value={amount} onChange={(e) => setAmount(e.target.value.replace(/[^\d]/g, ""))} />
          <input className="field" placeholder="Miért? (pl. közös bevásárlás) — opcionális"
            value={note} onChange={(e) => setNote(e.target.value)} />
          <div className="flex gap-2 pt-0.5">
            <button type="submit" className="btn-accent flex-1 py-2.5 text-[14px]">Hozzáadás</button>
            <button type="button" onClick={() => { setOpen(false); reset(); }}
              className="px-4 py-2.5 rounded-xl text-[14px] font-semibold"
              style={{ background: "var(--surface-2)", color: "var(--muted)" }}>Mégse</button>
          </div>
        </form>
      )}

      {items.length === 0 ? (
        <Empty>Nincs nyitott tartozás. 🎉</Empty>
      ) : (
        <ul className="space-y-2">
          {items.map((i) => {
            const gone = leaving[i.id];
            return (
              <li key={i.id} className={"card p-3 flex items-center gap-3 " + (gone ? "row-leave" : "")}>
                <button className="checkbox" data-on={gone} onClick={() => !gone && settle(i.id)}
                  aria-label="Rendezve">
                  {gone && <Icon name="check" className="w-4 h-4" style={{ color: "var(--accent-ink)" }} />}
                </button>
                <div className="flex-1 min-w-0" style={gone ? { color: "var(--muted)" } : null}>
                  <p className="text-[14px] leading-snug">
                    <span className="font-semibold">{i.payer}</span>
                    <span style={{ color: "var(--muted)" }}> fizetett </span>
                    <span className="font-semibold tnum">{forint(i.amount)}</span>
                  </p>
                  <p className="text-[13px] mt-0.5 flex items-center gap-1.5" style={{ color: "var(--muted)" }}>
                    <Icon name="arrow" className="w-3.5 h-3.5 flex-none" />
                    <span className="truncate">{i.note ? i.note : "rendezendő"}</span>
                  </p>
                </div>
                <button onClick={() => remove(i.id)} className="p-2 rounded-lg flex-none"
                  style={{ color: "var(--muted)" }} aria-label="Törlés">
                  <Icon name="trash" className="w-[18px] h-[18px]" />
                </button>
              </li>
            );
          })}
        </ul>
      )}
    </div>
  );
}

/* ================= APP SHELL ================= */
const TABS = [
  { key: "shopping", label: "Bevásárlás", icon: "cart" },
  { key: "inventory", label: "Készlet", icon: "box" },
  { key: "debts", label: "Tartozás", icon: "wallet" },
];

function App() {
  const [store, setStore] = useStore();
  const [tab, setTab] = useState("shopping");

  const setSlice = useCallback((key) => (updater) =>
    setStore((s) => ({ ...s, [key]: typeof updater === "function" ? updater(s[key]) : updater })), [setStore]);

  const badges = {
    shopping: store.shopping.filter((i) => !i.done).length,
    inventory: store.inventory.filter((i) => i.status === "red").length,
    debts: store.debts.length,
  };

  return (
    <div className="min-h-screen flex flex-col" style={{ background: "var(--ground)" }}>
      <header className="sticky top-0 z-20 border-b backdrop-blur"
        style={{ borderColor: "var(--line)", background: "color-mix(in srgb, var(--ground) 82%, transparent)" }}>
        <div className="mx-auto w-full max-w-[560px] px-4 py-3 flex items-center gap-3">
          <div className="w-9 h-9 rounded-xl grid place-items-center flex-none font-display font-bold"
            style={{ background: "var(--accent)", color: "var(--accent-ink)" }}>L</div>
          <div className="leading-tight">
            <div className="font-display text-[19px] font-semibold tracking-[-.01em]">Lakótársak</div>
            <div className="text-[11px]" style={{ color: "var(--muted)" }}>Közös háztartás egy helyen</div>
          </div>
        </div>
      </header>

      <main className="flex-1 mx-auto w-full max-w-[560px] px-4 pt-5 pb-28">
        {tab === "shopping" && <ShoppingView items={store.shopping} setItems={setSlice("shopping")} />}
        {tab === "inventory" && <InventoryView items={store.inventory} setItems={setSlice("inventory")} />}
        {tab === "debts" && <DebtsView items={store.debts} setItems={setSlice("debts")} />}
      </main>

      <nav className="fixed bottom-0 inset-x-0 z-20 border-t backdrop-blur"
        style={{ borderColor: "var(--line)", background: "color-mix(in srgb, var(--ground) 88%, transparent)" }}>
        <div className="mx-auto w-full max-w-[560px] grid grid-cols-3"
          style={{ paddingBottom: "env(safe-area-inset-bottom)" }}>
          {TABS.map((t) => (
            <button key={t.key} data-active={tab === t.key} onClick={() => setTab(t.key)}
              className="tab-btn relative flex flex-col items-center gap-1 py-2.5">
              <span className="relative">
                <Icon name={t.icon} className="w-6 h-6" />
                {badges[t.key] > 0 && (
                  <span className="absolute -top-1.5 -right-2 min-w-[16px] h-[16px] px-1 rounded-full text-[10px] font-bold grid place-items-center tnum"
                    style={{ background: "var(--accent)", color: "var(--accent-ink)" }}>
                    {badges[t.key]}
                  </span>
                )}
              </span>
              <span className="text-[11px] font-semibold">{t.label}</span>
            </button>
          ))}
        </div>
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
