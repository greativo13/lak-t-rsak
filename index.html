/* ---------- PWA: kezdőképernyő ikon + manifest (extra fájl nélkül) ---------- */
(function setupPWA(){
  try {
    const size = 192, c = document.createElement("canvas");
    c.width = c.height = size;
    const x = c.getContext("2d");
    x.fillStyle = "#3d5a80"; x.fillRect(0, 0, size, size);
    x.fillStyle = "#ffffff"; x.font = "bold 118px Georgia, serif";
    x.textAlign = "center"; x.textBaseline = "middle";
    x.fillText("L", size / 2, size / 2 + 8);
    const png = c.toDataURL("image/png");
    const apple = document.createElement("link");
    apple.rel = "apple-touch-icon"; apple.href = png; document.head.appendChild(apple);
    const manifest = {
      name: "Lakótársak", short_name: "Lakótársak", display: "standalone",
      background_color: "#f5f2ec", theme_color: "#3d5a80", start_url: "./",
      icons: [
        { src: png, sizes: "192x192", type: "image/png", purpose: "any" },
        { src: png, sizes: "512x512", type: "image/png", purpose: "any" },
      ],
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
    const ml = document.createElement("link"); ml.rel = "manifest";
    ml.href = URL.createObjectURL(blob); document.head.appendChild(ml);
  } catch (e) {}
  // offline indulás (sw.js): térerő nélkül is megnyílik az app
  try {
    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  } catch (e) {}
})();
</script>

  try {
    let d = localStorage.getItem("lakotarsak.device");
    if (!d) {
      d = "d" + Math.random().toString(36).slice(2, 10);
      localStorage.setItem("lakotarsak.device", d);

  } catch (e) {
    return "d" + Math.random().toString(36).slice(2, 10);

})();

const APP_VERSION = "2026-11-04.2";
function checkForUpdate() {
  if (!/^https?:$/.test(location.protocol)) return;
  fetch(location.pathname + "?nocache=" + Date.now(), {
    cache: "no-store"
  }).then(r => r.ok ? r.text() : "").then(t => {
    const m = t.match(/const APP_VERSION = "([^"]+)"/);
    if (!m || m[1] === APP_VERSION) return;
    const a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA)$/.test(a.tagName) && a.value) return; // ne vesszen el a félig beírt szöveg
    let tried = "";
    try {
      tried = sessionStorage.getItem("lakotarsak.updTried") || "";
    } catch (e) {}
    if (tried === m[1]) return; // egy verzióra csak egyszer próbálja (nincs végtelen újratöltés)
    try {
      sessionStorage.setItem("lakotarsak.updTried", m[1]);
    } catch (e) {}
    location.replace(location.pathname + "?v=" + encodeURIComponent(m[1]));
  }).catch(() => {});
}
checkForUpdate();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") checkForUpdate();
});

      g = parseInt(h.slice(2, 4), 16),
      b = parseInt(h.slice(4, 6), 16);
    return `rgba(${r},${g},${b},${a})`;
  } catch (e) {
    return `rgba(124,124,124,${a})`;
  }
}
function readableOn(hex) {
  try {
    const h = (hex || "#7c7c7c").replace("#", "");
    const r = parseInt(h.slice(0, 2), 16),
      g = parseInt(h.slice(2, 4), 16),
      b = parseInt(h.slice(4, 6), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.62 ? "#1a1a1a" : "#ffffff";
  } catch (e) {
    return "#ffffff";
  }
}

function findCat(cats, item) {
  if (!item) return null;
  if (item.catId) {
    const c = (cats || []).find(x => x.id === item.catId);
    if (c) return c;
  }
  if (item.category) {
    const k = item.category.trim().toLowerCase();
    const c = (cats || []).find(x => (x.name || "").trim().toLowerCase() === k);
    if (c) return c;
  }
  return null;
}

const forint = n => (Number(n) || 0).toLocaleString("hu-HU") + " Ft";
function timeAgo(ts) {
  if (!ts) return "";
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return "most";
  const m = Math.floor(s / 60);
  if (m < 60) return m + " perce";
  const h = Math.floor(m / 60);
  if (h < 24) return h + " órája";
  const d = Math.floor(h / 24);
  if (d === 1) return "tegnap";
  if (d < 7) return d + " napja";
  try {
    return new Date(ts).toLocaleDateString("hu-HU", {
      month: "short",
      day: "numeric"
    });
  } catch (e) {
    return d + " napja";
  }
}

  const title = name === "shopping" ? "Új a bevásárlólistán 🛒" : "Új tartozás 💸";
  const body = name === "shopping" ? who + (d.name || "Tétel") + (d.qty ? ` (${d.qty})` : "") : `${d.payer || "Valaki"} fizetett ${forint(d.amount)}${d.note ? " · " + d.note : ""}`;
  try {
    new Notification(title, {
      body,
      tag: name + "-" + Date.now()
    });
  } catch (e) {}
}
