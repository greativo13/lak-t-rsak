    if (!opts.length) { onToast && onToast(source === "tmdb" ? "Nincs találat, próbálj más szűrőt." : "Nincs a listán ilyen — vegyél fel párat!"); return; }
    setSpin(opts[Math.floor(Math.random() * opts.length)]);
  };

  return (
    <div>
      <SectionHead title="Mit nézzünk?" hint="Húzd jobbra, ami tetszik — a közös = match" />
      {TMDB_KEY && (
        <div className="seg mb-3" style={{ gridTemplateColumns: "1fr 1fr" }}>
          <button type="button" onClick={() => setSrc("tmdb")} style={source === "tmdb" ? { background: "var(--surface)", color: "var(--accent)", boxShadow: "inset 0 0 0 1.5px var(--line)" } : { color: "var(--muted)" }}>Ajánló (TMDB)</button>
          <button type="button" onClick={() => setSrc("saved")} style={source === "saved" ? { background: "var(--surface)", color: "var(--accent)", boxShadow: "inset 0 0 0 1.5px var(--line)" } : { color: "var(--muted)" }}>Saját lista</button>
        </div>
      )}

      <div className="card p-3 mb-4 space-y-2.5">
        <div className="flex flex-wrap gap-1.5">
          {["film", "sorozat", "mese"].map((k) => <Chip key={k} on={type === k} onClick={() => { setType(k); setGenre(""); }}>{k === "film" ? "🎬 Film" : k === "sorozat" ? "📺 Sorozat" : "🧸 Mese"}</Chip>)}
        </div>
        {type !== "mese" && (
          <div><p className="text-[12px] font-semibold mb-1.5" style={{ color: "var(--muted)" }}>Műfaj</p>
            <div className="flex flex-wrap gap-1.5">{genreList.map((gn) => <Chip key={gn.id} on={genre === gn.name} onClick={() => setGenre(genre === gn.name ? "" : gn.name)}>{gn.name}</Chip>)}</div></div>
        )}
        <div><p className="text-[12px] font-semibold mb-1.5" style={{ color: "var(--muted)" }}>Streaming</p>
          <div className="flex flex-wrap gap-1.5">{PROVIDERS.map((p) => <Chip key={p} on={provs.includes(p)} onClick={() => toggleProv(p)}>{p}</Chip>)}</div></div>
        <div className="flex gap-2 pt-0.5">
          <button onClick={startRound} disabled={loading} className="btn-accent flex-1 py-2.5 text-[14px]">{loading ? "Töltés…" : "🎬 Új kör indítása"}</button>
          <button onClick={spinPick} className="px-4 py-2.5 rounded-xl text-[14px] font-semibold border" style={{ borderColor: "var(--line)", color: "var(--accent)" }} title="Sorsolj egyet a szűrés alapján">🎡 Pörgesd!</button>
        </div>
        {spin && (
          <div className="rounded-xl p-3 flex items-center gap-3 pop" style={{ background: "var(--surface-2)" }}>
            {spin.poster ? <img src={spin.poster} alt="" className="w-12 h-16 rounded-lg object-cover flex-none" /> : <div className="w-12 h-16 rounded-lg grid place-items-center flex-none text-2xl" style={{ background: "var(--surface)" }}>🧸</div>}
            <div className="min-w-0"><p className="text-[11px] font-semibold" style={{ color: "var(--muted)" }}>Ezt nézzétek:</p><p className="font-display text-[18px] font-semibold truncate">{spin.title}</p></div>
          </div>
        )}
      </div>

      {matchOpts.length > 0 && (
        <div className="card p-3 mb-4 pop" style={{ borderColor: "var(--green-line)", background: "var(--green-bg)" }}>
          <p className="font-semibold mb-2" style={{ color: "var(--green)" }}>🎉 Közös kedvenc{matchOpts.length > 1 ? "ek" : ""} ({matchOpts.length}):</p>
          <ul className="space-y-2">
            {matchOpts.map((m) => (
              <li key={m.key} className="flex items-center gap-3">
                {m.poster ? <img src={m.poster} alt="" className="w-11 h-16 rounded-lg object-cover flex-none" /> : <div className="w-11 h-16 rounded-lg grid place-items-center flex-none text-2xl" style={{ background: "var(--surface)" }}>🎬</div>}
                <div className="min-w-0">
                  <p className="font-display text-[17px] font-semibold leading-tight truncate">{m.title}</p>
                  {(m.providers || []).length ? <p className="text-[12px]" style={{ color: "var(--muted)" }}>{(m.providers || []).join(", ")}</p> : null}
                  {m.link ? <a href={/^https?:\/\//i.test(m.link) ? m.link : "https://" + m.link} target="_blank" rel="noopener noreferrer" className="text-[12px] font-semibold" style={{ color: "var(--accent)" }}>🔗 Megnyitás</a> : null}
                </div>
              </li>
            ))}
          </ul>
        </div>
      )}

      {round ? (
        remaining.length ? (
          <div>
            <SwipeDeck card={remaining[0]} index={options.length - remaining.length} total={options.length} onDecide={decide} />
            <div className="flex justify-center gap-6 mt-3">
              <button onClick={() => decide(false)} className="w-14 h-14 rounded-full grid place-items-center text-2xl border" style={{ borderColor: "var(--red-line)", background: "var(--red-bg)", color: "var(--red)" }} aria-label="Passz">👎</button>
              <button onClick={() => decide(true)} className="w-14 h-14 rounded-full grid place-items-center text-2xl border" style={{ borderColor: "var(--green-line)", background: "var(--green-bg)", color: "var(--green)" }} aria-label="Tetszik">👍</button>
            </div>
          </div>
        ) : (
          <Empty>{matchOpts.length ? "Megvan a match! 🎉 Lásd fent a közös kedvenceket." : "Végignézted mind. Várd meg a lakótársad, vagy indíts új kört."}</Empty>
        )
      ) : (
        <Empty>Nincs aktív kör. Válassz szűrőt, és indíts egyet!</Empty>
      )}

      {round && (
        <button onClick={endRound} className="mt-3 w-full py-2.5 rounded-xl text-[13px] font-semibold inline-flex items-center justify-center gap-2 border" style={{ color: "var(--red)", borderColor: "var(--red-line)", background: "var(--red-bg)" }}>
          <Icon name="trash" className="w-[16px] h-[16px]" /> Kör lezárása
        </button>
      )}

      {source === "saved" && (
        <div className="mt-5">
          <div className="flex items-center justify-between mb-2">
            <button onClick={() => setShowList((s) => !s)} className="inline-flex items-center gap-1.5 text-[13px] font-semibold" style={{ color: "var(--muted)" }}>
              <Icon name="chevron" className="w-4 h-4" style={{ transform: showList ? "rotate(180deg)" : "none", transition: "transform .15s" }} /> Saját lista ({(watchlist || []).length})
            </button>
            <button onClick={() => { setWOpen((o) => !o); setWEditId(null); }} className="btn-accent inline-flex items-center gap-1.5 pl-3 pr-4 py-2 text-[13px]"><Icon name="plus" className="w-[16px] h-[16px]" /> Cím</button>
          </div>
          {wOpen && <WatchForm onSave={(d) => { onAddWatch(d); setWOpen(false); }} onCancel={() => setWOpen(false)} />}
          {showList && (
            <ul className="space-y-1.5">
              {(watchlist || []).map((w) => wEditId === w.id ? (
                <li key={w.id}><WatchForm initial={w} onSave={(d) => { onEditWatch(w.id, d); setWEditId(null); }} onCancel={() => setWEditId(null)} /></li>
              ) : (
                <li key={w.id} className="card p-2 flex items-center gap-2.5">
                  {w.img ? <Thumb src={w.img} /> : <div className="w-8 h-8 rounded-lg grid place-items-center flex-none text-base" style={{ background: "var(--surface-2)" }}>{w.kind === "sorozat" ? "📺" : w.kind === "mese" ? "🧸" : "🎬"}</div>}
                  <div className="flex-1 min-w-0">
                    <p className="font-semibold text-[15px] leading-tight truncate">{w.title}</p>
                    <p className="text-[11px] mt-0.5 truncate" style={{ color: "var(--muted)" }}>{[w.genre, (w.providers || []).join("/")].filter(Boolean).join(" · ")}</p>
                  </div>
                  <button onClick={() => { setWEditId(w.id); setWOpen(false); }} className="p-1.5 rounded-lg flex-none" style={{ color: "var(--muted)" }} aria-label="Módosítás"><Icon name="edit" className="w-[18px] h-[18px]" /></button>
                  <button onClick={() => onRemoveWatch(w.id)} className="p-1.5 rounded-lg flex-none" style={{ color: "var(--muted)" }} aria-label="Törlés"><Icon name="trash" className="w-[18px] h-[18px]" /></button>
                </li>
              ))}
            </ul>
          )}
        </div>
      )}
    </div>
  );
}

function LeisureView(props) {
  const [sub, setSub] = useState(() => { try { return localStorage.getItem("lakotarsak.leisureSub") || "movies"; } catch (e) { return "movies"; } });
  const setSubP = (s) => { setSub(s); try { localStorage.setItem("lakotarsak.leisureSub", s); } catch (e) {} };
  return (
    <div className="pop">
      <div className="seg mb-4" style={{ gridTemplateColumns: "1fr 1fr" }}>
        <button type="button" onClick={() => setSubP("movies")} style={sub === "movies" ? { background: "var(--surface)", color: "var(--accent)", boxShadow: "inset 0 0 0 1.5px var(--line)" } : { color: "var(--muted)" }}>🎬 Film/Sorozat</button>
        <button type="button" onClick={() => setSubP("games")} style={sub === "games" ? { background: "var(--surface)", color: "var(--accent)", boxShadow: "inset 0 0 0 1.5px var(--line)" } : { color: "var(--muted)" }}>🎲 Társas</button>
      </div>
      {sub === "games"
        ? <BoardGamesView items={props.boardgames} onAdd={props.onAddGame} onEdit={props.onEditGame} onRemove={props.onRemoveGame} />
        : <MoviesView watchlist={props.watchlist} onAddWatch={props.onAddWatch} onEditWatch={props.onEditWatch} onRemoveWatch={props.onRemoveWatch} onToast={props.onToast} />}
    </div>
  );
}

/* ================= APP ================= */
const TABS = [
  { key: "shopping", label: "Bevásárlás", icon: "cart" },
  { key: "inventory", label: "Készlet", icon: "box" },
  { key: "debts", label: "Tartozás", icon: "wallet" },
  { key: "leisure", label: "Szabadidő", icon: "dice" },
];

function IconBtn({ onClick, name, label, active, badge }) {
  return (
    <button onClick={onClick} className="relative w-9 h-9 grid place-items-center rounded-xl border flex-none"
      style={{ borderColor: "var(--line)", background: "var(--surface)", color: active ? "var(--accent)" : "var(--muted)" }}
      aria-label={label} title={label}>
      <Icon name={name} className="w-[18px] h-[18px]" />
      {badge > 0 && (
        <span className="absolute -top-1 -right-1 min-w-[15px] h-[15px] px-1 rounded-full text-[9px] font-bold grid place-items-center tnum"
          style={{ background: "var(--accent)", color: "var(--accent-ink)" }}>{badge}</span>
      )}
    </button>
  );
}

function App() {
  const { data, ops } = useBackend();
  const [tab, setTab] = useState("shopping");
  const [toast, setToast] = useState(null);
  const [notif, setNotif] = useState(() => ("Notification" in window) ? Notification.permission : "unsupported");
  const [myName, setMyName] = useState(getName());
  const [nameOpen, setNameOpen] = useState(false);
  const [catManagerOpen, setCatManagerOpen] = useState(false);
  const [members, setMembers] = useState([]);
  const toastTimer = useRef(null);

  useEffect(() => { if (cloud && !getName()) setNameOpen(true); }, []);

  const upsertMember = (nm) => {
    if (!cloud || !nm || !nm.trim()) return; // csak névvel rendelkező tag kerül a listába
    membersCol().doc(DEVICE).set({ name: nm.trim(), lastSeen: Date.now(), device: DEVICE }, { merge: true }).catch(console.error);
  };
  useEffect(() => {
    if (!cloud) return;
    upsertMember(getName());
    const unsub = membersCol().onSnapshot(
      (snap) => setMembers(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
      (err) => console.error("members", err)
    );
    return unsub;
  }, []);

  const showToast = (msg, action) => {
    setToast({ msg, action });
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), action ? 5000 : 2000);
  };
  const saveName = (n) => {
    try { localStorage.setItem("lakotarsak.name", n); } catch (e) {}
    setMyName(n); setNameOpen(false);
    if (cloud) {
      if (n) { upsertMember(n); showToast("Név mentve ✓"); }
      else { membersCol().doc(DEVICE).delete().catch(console.error); }
    }
  };
  const renameMember = (id, n) => {
    if (!cloud) return;
    membersCol().doc(id).set({ name: n || "" }, { merge: true }).catch(console.error);
    if (id === DEVICE) { try { localStorage.setItem("lakotarsak.name", n || ""); } catch (e) {} setMyName(n || ""); }
    showToast("Név frissítve ✓");
  };
  const removeMember = (id) => {
    if (!cloud) return;
    membersCol().doc(id).delete().catch(console.error);
    showToast("Lakótárs eltávolítva");
  };

  const enableNotif = async () => {
    if (!("Notification" in window)) { showToast("Ez a böngésző nem támogatja az értesítést"); return; }
    if (Notification.permission === "granted") { showToast("Az értesítés már be van kapcsolva ✓"); return; }
    if (Notification.permission === "denied") { showToast("Az értesítés le van tiltva a böngészőben"); return; }
    const p = await Notification.requestPermission();
    setNotif(p);
    showToast(p === "granted" ? "Értesítés bekapcsolva ✓" : "Értesítés nem engedélyezve");
  };
  const share = async () => {
    const url = location.origin + location.pathname;
    try {
      if (navigator.share) { await navigator.share({ title: "Lakótársak", url }); return; }
      await navigator.clipboard.writeText(url);
      showToast("Közös link másolva ✓");
    } catch (e) { showToast("Link: " + url); }
  };

  const toggleShopping = (it) => {
    const nowDone = !it.done;
    ops.update("shopping", it.id, { done: nowDone });
    if (nowDone) {
      const key = (it.name || "").trim().toLowerCase();
      const inv = data.inventory.find((x) => (x.name || "").trim().toLowerCase() === key);
      if (inv && inv.status !== "green") {
        ops.update("inventory", inv.id, { status: "green" });
        showToast("Készleten zöldre állítva: " + inv.name);
      }
    }
  };
  const removeWithUndo = (name, id, label) => {
    const item = (data[name] || []).find((i) => i.id === id);
    ops.remove(name, id);
    if (item) showToast(label || "Törölve", { label: "Visszavon", fn: () => ops.restore(name, [item]) });
  };
  const clearShopping = () => {
    const items = data.shopping;
    if (!items.length) return;
    ops.clear("shopping");
    showToast("Lista törölve", { label: "Visszavon", fn: () => ops.restore("shopping", items) });
  };
  const clearShoppingDone = () => {
    const items = data.shopping.filter((i) => i.done);
    if (!items.length) return;
    items.forEach((i) => ops.remove("shopping", i.id));
    showToast("Kész tételek törölve", { label: "Visszavon", fn: () => ops.restore("shopping", items) });
  };
  const sendToShoppingFromStock = (item) => {
    if (!item || (item.status !== "amber" && item.status !== "red")) return;
    const key = (item.name || "").trim().toLowerCase();
    if (!key) return;
    const exists = data.shopping.some((s) => !s.done && (s.name || "").trim().toLowerCase() === key);
    if (exists) return;
    ops.add("shopping", { name: item.name, qty: item.qty || "", catId: item.catId || "", owner: item.owner || "", done: false, from: "raktar" });
    showToast("Bevásárlólistára téve (raktárból): " + item.name);
  };
  const sendToInventory = (item) => {
    const key = (item.name || "").trim().toLowerCase();
    if (!key) return;
    const exists = data.inventory.some((x) => (x.name || "").trim().toLowerCase() === key);
    if (exists) { showToast("Már a készletben van: " + item.name); return; }
    ops.add("inventory", { name: item.name, qty: item.qty || "", catId: item.catId || "", owner: item.owner || "", status: "green" });
    showToast("Készletbe téve: " + item.name);
  };
  const doneToInventory = () => {
    const doneItems = data.shopping.filter((i) => i.done);
    if (!doneItems.length) return;
    doneItems.forEach((it) => {
      const key = (it.name || "").trim().toLowerCase();
      if (key && !data.inventory.some((x) => (x.name || "").trim().toLowerCase() === key)) {
        ops.add("inventory", { name: it.name, qty: it.qty || "", catId: it.catId || "", owner: it.owner || "", status: "green" });
      }
    });
    doneItems.forEach((it) => ops.remove("shopping", it.id));
    showToast("Kész tételek a készletbe ✓", { label: "Visszavon", fn: () => ops.restore("shopping", doneItems) });
  };
  const clearInventory = () => {
    const items = data.inventory;
    if (!items.length) return;
    ops.clear("inventory");
    showToast("Készlet ürítve", { label: "Visszavon", fn: () => ops.restore("inventory", items) });
  };

  const namedMembers = members.filter((m) => m.name && m.name.trim());
  const memberNames = [...new Set(namedMembers.map((m) => m.name.trim()))].sort((a, b) => a.localeCompare(b, "hu"));
  const cats = data.categories || [];
  const badges = {
    shopping: data.shopping.filter((i) => !i.done).length,
    inventory: data.inventory.filter((i) => i.status === "red").length,
    debts: data.debts.length,
  };

  return (
    <div className="min-h-screen flex flex-col" style={{ background: "var(--ground)" }}>
      <header className="sticky top-0 z-20 border-b" style={{ borderColor: "var(--line)", background: "color-mix(in srgb, var(--ground) 82%, transparent)", backdropFilter: "blur(8px)" }}>
        <div className="mx-auto w-full max-w-[560px] px-4 py-3 flex items-center gap-2.5">
          <div className="w-9 h-9 rounded-xl grid place-items-center flex-none font-display font-bold" style={{ background: "var(--accent)", color: "var(--accent-ink)" }}>L</div>
          <div className="leading-tight flex-1 min-w-0">
            <div className="font-display text-[19px] font-semibold tracking-[-.01em] truncate">Lakótársak</div>
            <div className="text-[11px] flex items-center gap-1.5" style={{ color: "var(--muted)" }}>
              <span className="inline-block w-2 h-2 rounded-full flex-none" style={{ background: cloud ? "var(--green)" : "var(--muted)" }} />
              <span className="truncate">{cloud ? (myName ? myName + " · szinkronban" : "Közös · szinkronban") : "Csak ezen az eszközön"}</span>
            </div>
          </div>
          {cloud && (
            <div className="flex items-center gap-1.5 flex-none">
              <IconBtn onClick={() => setNameOpen(true)} name="person" label="Neved és lakótársak" active={!!myName} badge={namedMembers.length} />
              <IconBtn onClick={enableNotif} name="bell" label="Értesítések bekapcsolása" active={notif === "granted"} />
              <IconBtn onClick={share} name="share" label="Megosztás" />
            </div>
          )}
        </div>
      </header>

      <main className="flex-1 mx-auto w-full max-w-[560px] px-4 pt-5 pb-28">
        {tab === "shopping" && (
          <ShoppingView items={data.shopping} cats={cats} memberNames={memberNames} onManageCats={() => setCatManagerOpen(true)}
            onAdd={(it) => ops.add("shopping", it)}
            onEdit={(id, patch) => ops.update("shopping", id, patch)}
            onToInventory={sendToInventory}
            onToggle={toggleShopping}
            onRemove={(id) => removeWithUndo("shopping", id)}
            onClear={clearShopping}
            onClearDone={clearShoppingDone}
            onDoneToInventory={doneToInventory}
            onTransfer={(d) => ops.add("debts", d)}
            onToast={showToast} />
        )}
        {tab === "inventory" && (
          <InventoryView items={data.inventory} cats={cats} memberNames={memberNames} onManageCats={() => setCatManagerOpen(true)}
            onAdd={(d) => { ops.add("inventory", d); sendToShoppingFromStock(d); }}
            onSave={(id, d) => { ops.update("inventory", id, d); sendToShoppingFromStock(d); }}
            onRemove={(id) => removeWithUndo("inventory", id)}
            onClear={clearInventory} />
        )}
        {tab === "debts" && (
          <DebtsView items={data.debts}
            onAdd={(d) => ops.add("debts", d)}
            onSettle={(id) => removeWithUndo("debts", id, "Rendezve")}
            onRemove={(id) => removeWithUndo("debts", id)} />
        )}
        {tab === "leisure" && (
          <LeisureView
            boardgames={data.boardgames || []}
            watchlist={data.watchlist || []}
            onToast={showToast}
            onAddGame={(d) => ops.add("boardgames", d)}
            onEditGame={(id, d) => ops.update("boardgames", id, d)}
            onRemoveGame={(id) => removeWithUndo("boardgames", id)}
            onAddWatch={(d) => ops.add("watchlist", d)}
            onEditWatch={(id, d) => ops.update("watchlist", id, d)}
            onRemoveWatch={(id) => removeWithUndo("watchlist", id)} />
        )}
      </main>

      {toast && (
        <div className="toast">
          <span>{toast.msg}</span>
          {toast.action && <button className="undo" onClick={() => { toast.action.fn(); setToast(null); }}>{toast.action.label}</button>}
        </div>
      )}

      {nameOpen && <NameModal initial={myName} members={namedMembers} onSave={saveName} onRenameMember={renameMember} onRemoveMember={removeMember} onClose={() => setNameOpen(false)} />}
      {catManagerOpen && <CategoryManager categories={cats} onAdd={(c) => ops.catAdd(c)} onUpdate={(id, p) => ops.catUpdate(id, p)} onRemove={(id) => ops.catRemove(id)} onClose={() => setCatManagerOpen(false)} />}

      <nav className="fixed bottom-0 inset-x-0 z-20 border-t" style={{ borderColor: "var(--line)", background: "color-mix(in srgb, var(--ground) 88%, transparent)", backdropFilter: "blur(8px)" }}>
        <div className="mx-auto w-full max-w-[560px] grid grid-cols-4" style={{ paddingBottom: "env(safe-area-inset-bottom)" }}>
          {TABS.map((t) => (
            <button key={t.key} data-active={tab === t.key} onClick={() => setTab(t.key)} className="tab-btn relative flex flex-col items-center gap-1 py-2.5">
              <span className="relative">
                <Icon name={t.icon} className="w-6 h-6" />
                {badges[t.key] > 0 && (
                  <span className="absolute -top-1.5 -right-2 min-w-[16px] h-[16px] px-1 rounded-full text-[10px] font-bold grid place-items-center tnum" style={{ background: "var(--accent)", color: "var(--accent-ink)" }}>{badges[t.key]}</span>
                )}
              </span>
              <span className="text-[11px] font-semibold">{t.label}</span>
            </button>
          ))}
        </div>
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
